const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const regions = [...new Set(DATA.map(d => d.region))];
const state = {q: "", st: "", region: ""};

const total = DATA.length, done = DATA.filter(d => d.active).length;
document.getElementById("n").textContent = done;
document.getElementById("of").textContent = "／ " + total + " 滝";
document.getElementById("rest").textContent = "未訪問 " + (total - done) + " 滝";
const rate = total ? done / total : 0, C = 2 * Math.PI * 48;
document.getElementById("pct").textContent = Math.round(rate * 100) + "%";
document.getElementById("donut").setAttribute("aria-label", "進捗率 " + Math.round(rate * 100) + "% (" + done + "/" + total + ")");
const arc = document.querySelector(".donut .arc");
arc.style.strokeDasharray = "0 " + C;
requestAnimationFrame(() => requestAnimationFrame(() => { arc.style.strokeDasharray = (C * rate) + " " + C; }));
document.getElementById("grid").innerHTML = DATA.map(d => '<i class="' + (d.active ? "on" : "") + '" title="' + esc(d.name) + '"></i>').join("");

const chips = document.getElementById("chips");
["", ...regions].forEach(r => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = r || "全地域";
  b.setAttribute("aria-pressed", String(r === state.region));
  b.onclick = () => { state.region = r; [...chips.children].forEach(c => c.setAttribute("aria-pressed", String(c === b))); render(); };
  chips.appendChild(b);
});
document.getElementById("q").oninput = e => { state.q = e.target.value.trim(); render(); };
document.getElementById("st").onchange = e => { state.st = e.target.value; render(); };

function render() {
  const q = state.q.toLowerCase();
  const list = DATA.filter(d =>
    (!state.region || d.region === state.region) &&
    (!state.st || (state.st === "a") === d.active) &&
    (!q || (d.name + d.pref).toLowerCase().includes(q)));
  if (!list.length) { document.getElementById("out").innerHTML = '<p class="empty">条件に合う滝がありません。</p>'; return; }
  let html = "";
  regions.filter(r => list.some(d => d.region === r)).forEach(r => {
    const items = list.filter(d => d.region === r);
    let prev = "";
    html += '<section><h2>' + esc(r) + '<small>' + items.filter(d => d.active).length + " / " + items.length + '</small></h2><div class="tbl"><table><thead><tr><th>都道府県</th><th>滝名</th><th>高さ</th><th>active</th><th>訪瀑日</th><th>Googleマップ</th></tr></thead><tbody>';
    items.forEach(d => {
      const p = d.pref === prev ? "" : d.pref; prev = d.pref;
      html += '<tr class="' + (d.active ? "v" : "") + '"><td class="pref">' + esc(p) + '</td><td class="nm">' + esc(d.name) + '</td><td>' +
        esc((d.height || "–").replace(/,/g, " / ")) + '</td><td>' + (d.active ? '<span class="act">active</span>' : '<span class="none">–</span>') + '</td><td>' +
        (d.dates.length ? d.dates.map(esc).join("<br>") : '<span class="none">–</span>') + '</td><td>' +
        (d.url ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">地図を開く</a>' : '<span class="none">–</span>') + '</td></tr>';
    });
    html += "</tbody></table></div></section>";
  });
  document.getElementById("out").innerHTML = html;
}
render();
</script>
